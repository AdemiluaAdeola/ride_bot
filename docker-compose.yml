version: "3.9"

services:
  api:
    build: .
    container_name: slickride_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./slickride.db
    volumes:
      - ./slickride.db:/app/slickride.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    build: .
    container_name: slickride_bot
    command: python telegram_bot.py
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SLICKRIDE_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./slickride.db:/app/slickride.db
